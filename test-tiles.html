<!DOCTYPE html>
<html>
<head>
    <title>测试瓦片加载</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 600px; width: 600px; border: 2px solid #333; }
        .info { margin: 10px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>🗺️ 多层瓦片测试</h1>
    <div class="info">
        <p>瓦片目录：<code>https://wiki-dev-patch-oss.oss-cn-hangzhou.aliyuncs.com/res/ap/map/xysg/cbt2/G/</code></p>
        <p>格式：<code>{z}/tile-{x}_{y}.png</code></p>
        <p>CRS: <code>L.CRS.Simple</code></p>
        <p>Bounds: <code>[[-6144, -6144], [6144, 6144]]</code></p>
    </div>
    <div id="map"></div>
    <div class="info">
        <p id="status">加载中...</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const serviceMaxZoom = 8;
        const bounds = [[-6144, -6144], [6144, 6144]];

        // 创建地图（Simple CRS）
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 4 - serviceMaxZoom,
            maxZoom: 8 - serviceMaxZoom,
            maxBounds: bounds
        });

        // 加载瓦片
        const tileLayer = L.tileLayer('https://wiki-dev-patch-oss.oss-cn-hangzhou.aliyuncs.com/res/ap/map/xysg/cbt2/G/{z}/tile-{x}_{y}.png', {
            minZoom: 4 - serviceMaxZoom,
            maxZoom: 8 - serviceMaxZoom,
            tileSize: 256,
            noWrap: true,
            bounds: bounds
        });

        tileLayer.getTileUrl = function (coords) {
            const serviceZoom = coords.z + serviceMaxZoom;
            return L.Util.template(this._url, {
                z: serviceZoom,
                x: coords.x,
                y: coords.y
            });
        };

        tileLayer.addTo(map);

        // 设置视图
        map.setView([-805, -1734], 5 - serviceMaxZoom);

        // 状态显示
        tileLayer.on('load', function() {
            document.getElementById('status').innerHTML = '✅ 瓦片加载成功！';
            document.getElementById('status').style.color = 'green';
        });

        tileLayer.on('error', function(e) {
            document.getElementById('status').innerHTML = '❌ 瓦片加载失败：' + e.message;
            document.getElementById('status').style.color = 'red';
        });

        // 显示坐标
        map.on('mousemove', function(e) {
            document.getElementById('status').innerHTML = 
                `📍 坐标：[${e.latlng.lat.toFixed(1)}, ${e.latlng.lng.toFixed(1)}] Zoom: ${map.getZoom() + serviceMaxZoom}`;
        });
    </script>
</body>
</html>
